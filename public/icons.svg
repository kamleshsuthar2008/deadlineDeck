  <symbol id="icon-trash" viewBox="0 0 20 20">
    <line x1="3" y1="5" x2="17" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M6 5V16C6 16.55 6.45 17 7 17H13C13.55 17 14 16.55 14 16V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M8 5V3.5C8 3.22 8.22 3 8.5 3H11.5C11.78 3 12 3.22 12 3.5V5" stroke="currentColor" stroke-width="1.5"/>
  </symbol>

