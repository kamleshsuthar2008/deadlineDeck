    <path d="M7 6V4.5C7 3.67 7.67 3 8.5 3H11.5C12.33 3 13 3.67 13 4.5V6" stroke="currentColor" stroke-width="1.5"/>
    <line x1="3" y1="11" x2="17" y2="11" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="10" cy="11" r="1.25" fill="currentColor"/>
  </symbol>

  <symbol id="icon-settings" viewBox="0 0 20 20">
