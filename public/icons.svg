    <rect x="11.5" y="4" width="3" height="12" rx="0.5" fill="currentColor"/>
  </symbol>

  <symbol id="icon-reset" viewBox="0 0 20 20">
    <path d="M3.5 10C3.5 6.41 6.41 3.5 10 3.5C13.04 3.5 15.59 5.58 16.32 8.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <polyline points="17 4 16.5 8.5 12 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M16.5 10C16.5 13.59 13.59 16.5 10 16.5C6.96 16.5 4.41 14.42 3.68 11.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
