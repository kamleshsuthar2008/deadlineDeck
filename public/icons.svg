<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- DeadlineDeck Geometric Logo Mark (24x24) -->
  <symbol id="icon-logo" viewBox="0 0 24 24">
    <rect x="2" y="2" width="20" height="20" rx="4" fill="#4567D8"/>
    <path d="M6 14L10 18L18 8" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="2" y1="9" x2="22" y2="9" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>
  </symbol>

  <!-- Navigation Icons (20x20, 1.5px stroke, currentColor) -->
  <symbol id="icon-dashboard" viewBox="0 0 20 20">
    <rect x="2.5" y="2.5" width="6.5" height="6.5" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <rect x="11" y="2.5" width="6.5" height="6.5" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <rect x="2.5" y="11" width="6.5" height="6.5" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <rect x="11" y="11" width="6.5" height="6.5" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
  </symbol>

  <symbol id="icon-planner" viewBox="0 0 20 20">
    <rect x="2.5" y="3.5" width="15" height="14" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <line x1="2.5" y1="7.5" x2="17.5" y2="7.5" stroke="currentColor" stroke-width="1.5"/>
    <line x1="6.5" y1="2" x2="6.5" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="13.5" y1="2" x2="13.5" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="11" x2="14" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="14" x2="11" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-tasks" viewBox="0 0 20 20">
