    <circle cx="10" cy="14.5" r="0.8" fill="currentColor"/>
  </symbol>

  <symbol id="icon-chevron-left" viewBox="0 0 20 20">
    <path d="M12.5 15L7.5 10L12.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
