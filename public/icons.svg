    <path d="M13 3L17 7L13.5 10.5L14 15L10 13L6 17L7 11L3.5 7.5L7.5 3.5L13 3Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </symbol>

  <symbol id="icon-copy" viewBox="0 0 20 20">
    <rect x="7" y="7" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <path d="M4.5 13H3.5C2.67 13 2 12.33 2 11.5V4.5C2 3.67 2.67 3 3.5 3H10.5C11.33 3 12 3.67 12 4.5V5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

