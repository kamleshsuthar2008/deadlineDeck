  <symbol id="icon-filter" viewBox="0 0 20 20">
    <polygon points="3 4 17 4 11.5 11 11.5 16 8.5 14 8.5 11 3 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </symbol>

