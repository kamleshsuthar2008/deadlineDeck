  </symbol>

  <symbol id="icon-logout" viewBox="0 0 20 20">
    <path d="M7.5 17H4.5C3.67 17 3 16.33 3 15.5V4.5C3 3.67 3.67 3 4.5 3H7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8.5" y1="10" x2="17" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M13.5 6.5L17 10L13.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
