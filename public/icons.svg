    <path d="M15 10.5V15.5C15 16.33 14.33 17 13.5 17H4.5C3.67 17 3 16.33 3 15.5V6.5C3 5.67 3.67 5 4.5 5H9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <polyline points="11.5 3 17 3 17 8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="8.5" y1="11.5" x2="17" y2="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-close" viewBox="0 0 20 20">
    <line x1="4.5" y1="4.5" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15.5" y1="4.5" x2="4.5" y2="15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
