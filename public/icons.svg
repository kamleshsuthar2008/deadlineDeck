    <rect x="8.75" y="6" width="2.5" height="9.5" rx="0.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <rect x="13.5" y="3" width="2.5" height="12.5" rx="0.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
