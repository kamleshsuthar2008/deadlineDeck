  <symbol id="icon-subjects" viewBox="0 0 20 20">
    <path d="M3.5 4.5C3.5 3.67 4.17 3 5 3H16.5V17H5C4.17 17 3.5 16.33 3.5 15.5V4.5Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <line x1="3.5" y1="14" x2="16.5" y2="14" stroke="currentColor" stroke-width="1.5"/>
    <line x1="7" y1="7" x2="13" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="7" y1="10" x2="11" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
