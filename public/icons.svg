    <path d="M6.5 10.5L8.5 12.5L13.5 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </symbol>

  <symbol id="icon-calendar" viewBox="0 0 20 20">
    <rect x="2.5" y="3.5" width="15" height="14" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <line x1="2.5" y1="7.5" x2="17.5" y2="7.5" stroke="currentColor" stroke-width="1.5"/>
    <line x1="6.5" y1="2" x2="6.5" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="13.5" y1="2" x2="13.5" y2="4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="6.5" cy="11" r="1" fill="currentColor"/>
    <circle cx="10" cy="11" r="1" fill="currentColor"/>
    <circle cx="13.5" cy="11" r="1" fill="currentColor"/>
    <circle cx="6.5" cy="14" r="1" fill="currentColor"/>
    <circle cx="10" cy="14" r="1" fill="currentColor"/>
