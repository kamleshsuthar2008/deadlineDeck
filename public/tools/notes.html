<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Notes — DeadlineDeck</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/toolkit.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .notes-two-pane {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: var(--space-20);
      min-height: 520px;
      align-items: start;
    }
    .notes-list-pane {
      display: flex;
      flex-direction: column;
      gap: var(--space-8);
      max-height: 600px;
      overflow-y: auto;
    }
    .note-card-item {
      background: var(--card);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: var(--space-12);
      cursor: pointer;
      transition: background-color var(--transition-fast), border-color var(--transition-fast);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .note-card-item:hover {
      background-color: var(--surface);
    }
    .note-card-item.is-selected {
      background-color: var(--surface);
      border-color: var(--accent);
      border-left: 3px solid var(--accent);
    }
    .note-card-item.is-pinned {
      border-color: var(--border-strong);
    }
    @media (max-width: 800px) {
      .notes-two-pane { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo-mark">
          <svg><use href="/icons.svg#icon-logo"></use></svg>
        </div>
        <span class="brand-wordmark">DeadlineDeck</span>
      </div>

      <nav class="sidebar-nav">
        <a href="/dashboard.html" class="nav-link">
          <svg><use href="/icons.svg#icon-dashboard"></use></svg>
          <span>Dashboard</span>
        </a>
        <a href="/planner.html" class="nav-link">
          <svg><use href="/icons.svg#icon-planner"></use></svg>
          <span>My Planner</span>
        </a>
        <a href="/tasks.html" class="nav-link">
          <svg><use href="/icons.svg#icon-tasks"></use></svg>
          <span>Tasks</span>
        </a>
        <a href="/calendar.html" class="nav-link">
          <svg><use href="/icons.svg#icon-calendar"></use></svg>
          <span>Calendar</span>
        </a>
        <a href="/subjects.html" class="nav-link">
          <svg><use href="/icons.svg#icon-subjects"></use></svg>
          <span>Subjects</span>
        </a>
        <a href="/insights.html" class="nav-link">
          <svg><use href="/icons.svg#icon-insights"></use></svg>
          <span>Insights &amp; Reports</span>
        </a>
        <a href="/toolkit.html" class="nav-link active">
          <svg><use href="/icons.svg#icon-toolkit"></use></svg>
          <span>Student Toolkit</span>
        </a>
        <a href="/settings.html" class="nav-link">
          <svg><use href="/icons.svg#icon-settings"></use></svg>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-badge">
          <div class="user-avatar-monogram">--</div>
          <div class="user-info-text">
            <div class="user-display-name">Loading...</div>
            <div class="user-display-email">student@college.edu</div>
          </div>
        </div>
        <button class="btn-sidebar-logout">
          <svg><use href="/icons.svg#icon-logout"></use></svg>
          <span>Log out</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay"></div>

    <div class="main-wrapper">
      <header class="mobile-top-bar">
        <div class="mobile-brand">
          <svg style="width:20px;height:20px;"><use href="/icons.svg#icon-logo"></use></svg>
          <span>DeadlineDeck</span>
        </div>
        <button class="mobile-menu-btn" aria-label="Open navigation menu">
          <svg><use href="/icons.svg#icon-menu"></use></svg>
        </button>
      </header>

      <main class="main-canvas">
        <div class="single-column-workspace">
          <nav class="tool-breadcrumb">
            <a href="/toolkit.html">&larr; Student Toolkit</a>
            <span>/</span>
            <span>Quick Notes</span>
          </nav>

          <div class="tool-workspace">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: var(--space-12);">
              <div>
                <span class="label-eyebrow">Academic Utility 5</span>
                <h1 class="page-title">Quick Notes</h1>
                <p class="secondary" style="margin-top: 4px;">Subject-associated study notes with pinning and search.</p>
              </div>
              <button id="btn-new-note" class="btn btn-primary">
                <svg><use href="/icons.svg#icon-plus"></use></svg>
                <span>New note</span>
              </button>
            </div>

            <!-- 2-Pane Clean Layout -->
            <div class="notes-two-pane">
              <!-- Left: Search & Note List -->
              <div style="display: flex; flex-direction: column; gap: var(--space-12);">
                <input type="text" id="note-search" class="input-text" placeholder="Search notes..." style="height: 36px; font-size: 13px;">
                <div id="notes-list" class="notes-list-pane">
                  <!-- Rendered dynamically -->
                </div>
              </div>

              <!-- Right: Note Editor / Reader Pane -->
              <div class="panel">
                <div class="panel-header" style="justify-content: space-between;">
                  <span class="section-title" id="editor-header-title">Note Editor</span>
                  <div style="display: flex; gap: var(--space-8); align-items: center;">
                    <button id="btn-pin-note" class="btn btn-ghost" style="padding: 4px;" title="Toggle pin status">
                      <svg style="width:16px;height:16px;"><use href="/icons.svg#icon-pin"></use></svg>
                    </button>
                    <button id="btn-delete-note" class="btn btn-danger-ghost" style="padding: 4px;" title="Delete note">
                      <svg style="width:16px;height:16px;"><use href="/icons.svg#icon-trash"></use></svg>
                    </button>
                  </div>
                </div>

                <form id="note-editor-form" class="panel-body" style="display: flex; flex-direction: column; gap: var(--space-16);">
                  <input type="hidden" id="edit-note-id">
                  <div class="form-group" style="margin: 0;">
                    <label class="form-label" for="edit-note-title">Title</label>
                    <input type="text" id="edit-note-title" class="input-text" required placeholder="Note title...">
                  </div>

                  <div class="form-group" style="margin: 0;">
                    <label class="form-label" for="edit-note-subject">Subject (optional)</label>
                    <select id="edit-note-subject" class="input-select">
                      <option value="">No subject linked</option>
                    </select>
                  </div>

                  <div class="form-group" style="margin: 0;">
                    <label class="form-label" for="edit-note-content">Content</label>
                    <textarea id="edit-note-content" class="input-textarea" style="min-height: 220px; font-family: var(--font-sans); font-size: 14px; line-height: 1.6;" placeholder="Type your revision definitions, exam tips, key formulas..."></textarea>
                  </div>

                  <div>
                    <button type="submit" class="btn btn-primary" id="btn-save-note">Save note</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/tools/notes.js"></script>
</body>
</html>
